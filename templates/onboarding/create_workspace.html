{% extends 'base.html' %}

{% block title %}Create Workspace - Step 1{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
        <!-- Progress Steps -->
        <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-100 text-xs font-semibold text-slate-400">
            <span class="text-indigo-600">1. Basic Info</span>
            <span>&rarr;</span>
            <span>2. Select Modules</span>
        </div>

        <h2 class="text-2xl font-bold text-slate-900">Name your Workspace</h2>
        <p class="text-sm text-slate-500 mt-1">Configure your organization details to continue.</p>

        <form method="post" class="mt-6 space-y-5">
            {% csrf_token %}

            <div>
                <label for="id_name" class="block text-sm font-medium text-slate-700">Workspace / Business Name</label>
                <input type="text" name="name" id="id_name" required placeholder="Acme Corp"
                       class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm">
            </div>

            <div>
                <label for="id_business_type" class="block text-sm font-medium text-slate-700">Business Type</label>
                <select name="business_type" id="id_business_type" required
                        class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm bg-white">
                    <option value="" disabled selected>Select your industry</option>
                    <option value="retail">Retail / Physical Store</option>
                    <option value="services">Professional Services / Agency</option>
                    <option value="ecommerce">E-commerce</option>
                    <option value="healthcare">Healthcare / Clinic</option>
                </select>
            </div>

            <div class="pt-4 flex justify-between items-center">
                <a href="{% url 'user_hub' %}" class="text-sm text-slate-500 hover:text-slate-800">Cancel</a>
                <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white font-semibold text-sm rounded-lg shadow hover:bg-indigo-700 transition">
                    Continue &rarr;
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
