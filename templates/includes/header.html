<header x-data="{ open: false }" class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <!-- Brand Logo -->
        <a href="{% url 'landing' %}" class="flex items-center gap-2 font-bold text-xl text-indigo-600">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span>SaaSify</span>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
            <a href="#features" class="hover:text-indigo-600 transition">Features</a>
            <a href="#pricing" class="hover:text-indigo-600 transition">Pricing</a>
            <a href="#faq" class="hover:text-indigo-600 transition">FAQ</a>
        </nav>

        <!-- Dynamic Auth Actions -->
        <div class="hidden md:flex items-center gap-4">
            {% if user.is_authenticated %}
                <a href="{% url 'user_hub' %}" class="text-sm font-semibold text-slate-700 hover:text-indigo-600">
                    My Account ({{ user.email }})
                </a>
                <a href="{% url 'user_hub' %}" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition shadow-sm">
                    Go to Portal
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="text-sm font-semibold text-slate-700 hover:text-indigo-600">
                    Sign in
                </a>
                <a href="{% url 'register' %}" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition shadow-sm">
                    Get Started
                </a>
            {% endif %}
        </div>

        <!-- Mobile Menu Toggle Button -->
        <button @click="open = !open" class="md:hidden text-slate-600 focus:outline-none p-2">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path x-show="!open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                <path x-show="open" x-cloak stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <!-- Mobile Dropdown -->
    <div x-show="open" x-cloak class="md:hidden border-b border-slate-200 bg-white px-4 pt-2 pb-6 space-y-3">
        <a href="#features" class="block text-slate-600 py-1">Features</a>
        <a href="#pricing" class="block text-slate-600 py-1">Pricing</a>
        <div class="pt-4 border-t border-slate-100 flex flex-col gap-2">
            {% if user.is_authenticated %}
                <a href="{% url 'user_hub' %}" class="w-full text-center py-2 bg-indigo-600 text-white rounded-lg font-medium">Go to Portal</a>
            {% else %}
                <a href="{% url 'login' %}" class="w-full text-center py-2 border border-slate-300 text-slate-700 rounded-lg font-medium">Sign in</a>
                <a href="{% url 'register' %}" class="w-full text-center py-2 bg-indigo-600 text-white rounded-lg font-medium">Get Started</a>
            {% endif %}
        </div>
    </div>
</header>
